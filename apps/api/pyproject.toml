[project]
name = "api"
version = "0.1.0"
description = "Junction 2026 API"
authors = [
    { name = "Quoc Anh Nguyen", email = "nguyen@qa.id.vn" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.7",
    "openai>=2",
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
