<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">A purchasing agent ordering from the Valio Aimo warehouse over MCP</title>
  <desc id="d">A chat window with an agent request on the left, the MCP connection in the middle, and the warehouse with milk cartons and a delivery truck on the right.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f0ff"/>
      <stop offset="1" stop-color="#f7faff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d5bd8"/>
      <stop offset="1" stop-color="#0b3d91"/>
    </linearGradient>
    <linearGradient id="carton" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b3d91" flood-opacity="0.18"/>
    </filter>
  <g id="milk">
      <path d="M0 0 L10 -12 H30 L40 0 V52 H0Z" fill="url(#carton)" stroke="#0b3d91" stroke-width="2" stroke-linejoin="round"/>
      <path d="M10 -12 L20 0 H40" stroke="#0b3d91" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <rect x="4" y="16" width="32" height="16" rx="3" fill="#1d5bd8"/>
      <path d="M10 41 q10 -8 20 0" stroke="#7aa6f5" stroke-width="2" fill="none"/>
    </g>
  </defs>

  <rect width="640" height="420" rx="28" fill="url(#sky)"/>
  <circle cx="560" cy="70" r="90" fill="#cfe0ff" opacity="0.6"/>
  <circle cx="70" cy="380" r="110" fill="#dbe8ff" opacity="0.7"/>
  <path d="M0 330 Q160 300 320 330 T640 320 V420 H0Z" fill="#d6e4ff" opacity="0.7"/>

  <!-- Agent chat window -->
  <g filter="url(#shadow)">
    <rect x="34" y="62" width="236" height="250" rx="18" fill="#fff"/>
    <rect x="34" y="62" width="236" height="38" rx="18" fill="#0b3d91"/>
    <rect x="34" y="84" width="236" height="16" fill="#0b3d91"/>
  </g>
  <circle cx="56" cy="81" r="5" fill="#ff8a7a"/>
  <circle cx="72" cy="81" r="5" fill="#ffd36e"/>
  <circle cx="88" cy="81" r="5" fill="#7ee0a1"/>
  <text x="152" y="86" fill="#fff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">purchasing agent</text>

  <rect x="50" y="116" width="190" height="52" rx="12" fill="#eef3ff"/>
  <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1b2a4a">
    <tspan x="62" y="137">1,000 L lactose-free milk</tspan>
    <tspan x="62" y="154">by Monday, best price.</tspan>
  </text>

  <rect x="74" y="180" width="180" height="70" rx="12" fill="url(#blue)"/>
  <text font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#dbe6fb">
    <tspan x="86" y="200">search_products ✓</tspan>
    <tspan x="86" y="216">quote · 3 options ✓</tspan>
    <tspan x="86" y="232">place_order → approval</tspan>
  </text>

  <rect x="50" y="262" width="120" height="30" rx="10" fill="#e7f8ee"/>
  <circle cx="66" cy="277" r="6" fill="#2fb36b"/>
  <path d="M63 277l2.2 2.2L69.5 275" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text x="80" y="281" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17633b" font-weight="600">€2.48 / L</text>

  <!-- MCP link -->
  <path d="M276 190 C310 150 340 230 372 190" stroke="#1d5bd8" stroke-width="3" fill="none" stroke-dasharray="2 9" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="292" y="150" width="64" height="32" rx="16" fill="#fff"/>
  </g>
  <text x="324" y="171" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#0b3d91" text-anchor="middle">MCP</text>
  <circle cx="276" cy="190" r="5" fill="#1d5bd8"/>
  <circle cx="372" cy="190" r="5" fill="#1d5bd8"/>

  <!-- Warehouse -->
  <g filter="url(#shadow)">
    <path d="M382 150 L494 96 L606 150 V306 H382Z" fill="#fff"/>
  </g>
  <path d="M382 150 L494 96 L606 150" stroke="#0b3d91" stroke-width="6" fill="none" stroke-linejoin="round"/>
  <rect x="452" y="118" width="84" height="22" rx="6" fill="#0b3d91"/>
  <text x="494" y="134" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">VALIO AIMO</text>

  <!-- shelf -->
  <rect x="402" y="236" width="184" height="6" rx="3" fill="#b9cdf3"/>
  <rect x="402" y="296" width="184" height="6" rx="3" fill="#b9cdf3"/>

  <!-- milk cartons -->
  <use href="#milk" x="414" y="184"/>
  <use href="#milk" x="462" y="184"/>
  <use href="#milk" x="510" y="184"/>

  <!-- crates -->
  <rect x="414" y="256" width="48" height="40" rx="6" fill="#ffd36e" stroke="#c99a2e" stroke-width="2"/>
  <rect x="470" y="256" width="48" height="40" rx="6" fill="#ffd36e" stroke="#c99a2e" stroke-width="2"/>
  <rect x="526" y="256" width="48" height="40" rx="6" fill="#ffe7a8" stroke="#c99a2e" stroke-width="2"/>
  <path d="M422 270 H454 M478 270 H510 M534 270 H566" stroke="#c99a2e" stroke-width="2"/>

  <!-- truck -->
  <g transform="translate(300 312)">
    <rect x="0" y="0" width="118" height="54" rx="8" fill="url(#blue)"/>
    <path d="M118 14 H148 L168 34 V54 H118Z" fill="#1d5bd8"/>
    <rect x="128" y="20" width="22" height="14" rx="3" fill="#cfe0ff"/>
    <text x="59" y="33" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Monday ✓</text>
    <circle cx="30" cy="58" r="12" fill="#1b2a4a"/>
    <circle cx="30" cy="58" r="5" fill="#cfe0ff"/>
    <circle cx="140" cy="58" r="12" fill="#1b2a4a"/>
    <circle cx="140" cy="58" r="5" fill="#cfe0ff"/>
  </g>
  <path d="M250 352 H288 M262 364 H292" stroke="#7aa6f5" stroke-width="3" stroke-linecap="round"/>
</svg>
