[tools]
python = "3.13"
uv = "0.12"

[env]
_.file = { path = ".env", redact = true }
API_PORT = "8000"

[tasks.install]
description = "Install API dependencies"
depends = ["install:*"]

[tasks."install:api"]
dir = "apps/api"
run = "uv sync --locked"

[tasks.dev]
description = "Run the API dev server"
depends = ["dev:*"]

[tasks."dev:api"]
dir = "apps/api"
run = "uv run fastapi dev src/api/main.py --host 127.0.0.1 --port $API_PORT"

[tasks."agent:create"]
description = "Register a purchasing agent and print its key once (args: --name --customer [--role admin] [--spend-limit] [--require TAG] [--ban CODE])"
dir = "apps/api"
run = "uv run python -m api.agents.cli create"

[tasks."agent:list"]
description = "List purchasing agents (never shows keys)"
dir = "apps/api"
run = "uv run python -m api.agents.cli list"

[tasks."agent:set-role"]
description = "Change a purchasing agent's role without reissuing its key (args: <agent_id> member|admin)"
dir = "apps/api"
run = "uv run python -m api.agents.cli set-role"

[tasks."skill:sandbox"]
description = "Set up a directory outside the repo where plain `claude` has the valio-aimo MCP and purchasing skill (needs VALIO_AIMO_AGENT_KEY)"
file = "scripts/skill-sandbox.sh"

[tasks.check]
description = "Lint, typecheck and test everything"
depends = ["lint", "typecheck", "test"]

[tasks.lint]
depends = ["lint:*"]

[tasks."lint:api"]
dir = "apps/api"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.typecheck]
depends = ["typecheck:*"]

[tasks."typecheck:api"]
dir = "apps/api"
run = "uv run pyright"

[tasks.test]
depends = ["test:*"]

[tasks."test:api"]
dir = "apps/api"
run = "uv run pytest"

[tasks.fmt]
description = "Auto-fix Python lint and formatting"
dir = "apps/api"
run = ["uv run ruff check --fix .", "uv run ruff format ."]
